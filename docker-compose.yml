name: ssabway

services:
  frontend:
    build: ./frontend
    restart: unless-stopped

  mysql:
    image: mysql:8.0.46
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: Asia/Seoul
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build: ./backend/ssabway
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      WEBRTC_BASE_URL: http://signaling:8080
      WEBRTC_INTERNAL_SECRET: ${INTERNAL_API_SECRET}
      # 표지판 인식 AI. ai 서비스는 docker-compose.prod.yml 에만 있으므로
      # 로컬에서는 이 주소가 뜨지 않고 인식 요청만 502 로 떨어진다.
      AI_BASE_URL: ${AI_BASE_URL:-http://ai:8000}
      TZ: Asia/Seoul
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      JWT_SECRET: ${JWT_SECRET}
      ODSAY_API_KEY : ${ODSAY_API_KEY}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      GMS_API_KEY: ${GMS_API_KEY}
    depends_on:
      mysql: { condition: service_healthy }
    restart: unless-stopped

  signaling:
    build: ./backend/ssabway_webrtc
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      OPENVIDU_URL: ${OPENVIDU_URL}
      OPENVIDU_SECRET: ${OPENVIDU_SECRET}
      OPENVIDU_WEBHOOK_SECRET: ${OPENVIDU_WEBHOOK_SECRET}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      # api 와 반드시 같은 값이어야 한다 — 사용자·역무원이 api 에서 발급받은
      # JWT 를 이 서비스가 검증한다. 없으면 application.yaml 의
      # `jwt.secret: ${JWT_SECRET}` placeholder 를 못 채워 기동 자체가 실패하고
      # (restart: unless-stopped 로 재시작 루프) 화상 기능 전체가 죽는다.
      # ⚠️ --env-file 은 compose 파일의 ${} 치환용일 뿐, 컨테이너 환경변수로
      #    자동 주입되지 않는다. 여기 명시해야 컨테이너에 들어간다.
      JWT_SECRET: ${JWT_SECRET}
      TZ: Asia/Seoul
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
    depends_on:
      mysql: { condition: service_healthy }
    restart: unless-stopped

volumes:
  mysql-data: