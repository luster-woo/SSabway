services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    restart: unless-stopped

  mysql:
    image: mysql:8.0.46
    environment:
      MYSQL_ROOT_PASSWORD: localonly
      MYSQL_DATABASE: ssabway
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plocalonly"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

volumes:
  mysql-data:
