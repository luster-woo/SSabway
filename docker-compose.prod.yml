services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "127.0.0.1:5442:80"
    depends_on: [frontend, api, signaling]
    networks:
      default:
      edge:
    restart: unless-stopped
  ai:
    build: ./ai/serve
    environment:
      TORCH_THREADS: "2"
      MAX_SIDE: "1280"
      TZ: Asia/Seoul
    volumes:
      - /opt/models:/models:ro
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

networks:
  edge:
    external: true