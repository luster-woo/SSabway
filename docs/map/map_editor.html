<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>대구역 2D 맵 에디터</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: "Malgun Gothic", "Segoe UI", sans-serif; font-size: 13px; }
  body { display: flex; flex-direction: column; overflow: hidden; background: #eceff1; }

  #topbar {
    display: flex; align-items: center; gap: 6px; padding: 6px 10px;
    background: #263238; color: #fff; flex-wrap: wrap;
  }
  #topbar .title { font-weight: bold; margin-right: 10px; }
  #floors { display: flex; gap: 4px; align-items: center; }
  .ftab {
    padding: 5px 12px; border-radius: 6px 6px 0 0; background: #455a64; color: #cfd8dc;
    cursor: pointer; user-select: none; border: none; font-size: 13px;
  }
  .ftab.on { background: #fff; color: #263238; font-weight: bold; }
  .ftab .x { margin-left: 6px; color: #ef9a9a; }
  .spacer { flex: 1; }
  #topbar button.act {
    padding: 5px 10px; border: none; border-radius: 5px; background: #546e7a;
    color: #fff; cursor: pointer; font-size: 12px;
  }
  #topbar button.act:hover { background: #78909c; }
  #topbar button.act.primary { background: #1e88e5; }

  #main { flex: 1; display: flex; min-height: 0; }

  #side {
    width: 168px; background: #fff; border-right: 1px solid #cfd8dc;
    overflow-y: auto; padding: 8px; flex-shrink: 0;
  }
  #side h4 { font-size: 11px; color: #90a4ae; margin: 10px 0 4px; }
  #side h4:first-child { margin-top: 0; }
  .tbtn {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 7px 8px; margin: 2px 0; border: 1px solid #eceff1; border-radius: 6px;
    background: #fff; cursor: pointer; font-size: 13px; text-align: left;
  }
  .tbtn:hover { background: #f5f5f5; }
  .tbtn.on { background: #e3f2fd; border-color: #1e88e5; font-weight: bold; }
  .tbtn .key { margin-left: auto; color: #b0bec5; font-size: 11px; }
  .fbtn {
    display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
    width: 47px; height: 47px; margin: 1px; border: 1px solid #eceff1; border-radius: 6px;
    background: #fff; cursor: pointer; font-size: 15px;
  }
  .fbtn small { font-size: 10px; font-weight: bold; }
  .fbtn:hover { background: #f5f5f5; }
  .fbtn.on { background: #e3f2fd; border-color: #1e88e5; }
  #side label.opt { display: flex; align-items: center; gap: 6px; padding: 4px 2px; cursor: pointer; }
  #side .bgrow { display: flex; align-items: center; gap: 4px; padding: 3px 2px; font-size: 12px; }
  #side .bgrow input[type=range] { flex: 1; width: 60px; }
  #side button.small {
    width: 100%; padding: 5px; margin: 2px 0; border: 1px solid #cfd8dc;
    border-radius: 5px; background: #fafafa; cursor: pointer; font-size: 12px;
  }

  #wrap { flex: 1; position: relative; min-width: 0; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #txtIn {
    position: absolute; display: none; z-index: 5; font-size: 15px; padding: 3px 6px;
    border: 2px solid #1e88e5; border-radius: 4px; outline: none; min-width: 140px;
  }

  #props {
    display: none; align-items: center; gap: 10px; padding: 6px 12px;
    background: #fff; border-top: 1px solid #cfd8dc; flex-wrap: wrap;
  }
  #props.show { display: flex; }
  #props .pt { font-weight: bold; color: #37474f; }
  #props label { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #546e7a; }
  #props input[type=text] { padding: 4px 6px; border: 1px solid #cfd8dc; border-radius: 4px; width: 130px; }
  #props input[type=number] { padding: 4px; border: 1px solid #cfd8dc; border-radius: 4px; width: 55px; }
  #props button.del {
    padding: 4px 10px; border: none; border-radius: 4px; background: #ef5350;
    color: #fff; cursor: pointer; margin-left: auto;
  }
  #props select { padding: 3px 4px; border: 1px solid #cfd8dc; border-radius: 4px; }
  #props button.mv {
    padding: 4px 9px; border: 1px solid #90a4ae; border-radius: 4px;
    background: #eceff1; cursor: pointer; font-size: 12px;
  }
  #props button.mv:hover { background: #cfd8dc; }

  #status {
    padding: 4px 12px; background: #37474f; color: #b0bec5; font-size: 12px;
    display: flex; gap: 16px;
  }
  #status .zoom { margin-left: auto; }

  /* ===== 경로(Navigation Graph) 편집 ===== */
  #modeTabs { display: flex; gap: 0; margin-right: 8px; }
  #modeTabs button {
    padding: 5px 12px; border: none; background: #455a64; color: #cfd8dc;
    cursor: pointer; font-size: 12px;
  }
  #modeTabs button:first-child { border-radius: 5px 0 0 5px; }
  #modeTabs button:last-child { border-radius: 0 5px 5px 0; }
  #modeTabs button.on { background: #ffb300; color: #263238; font-weight: bold; }
  #topbar button.act.nav { background: #00897b; }
  #topbar button.act.nav:hover { background: #26a69a; }
  #navSide { display: none; }
  /* 힌트는 기본 2줄만 보여주고 클릭하면 펼친다 (사이드바 높이를 아끼기 위함) */
  #navSide .navinfo {
    background: #f5f5f5; border-radius: 5px; padding: 5px 6px; margin: 4px 0;
    font-size: 11px; color: #546e7a; line-height: 1.5; cursor: pointer;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  #navSide .navinfo.open { -webkit-line-clamp: unset; }
  #navSide h4 { display: flex; align-items: baseline; gap: 5px; }
  #navProps {
    border-top: 1px solid #cfd8dc; margin-top: 6px; padding-top: 6px; font-size: 12px;
  }
  #navProps .row { display: flex; align-items: center; gap: 5px; margin: 4px 0; }
  #navProps .row label { color: #78909c; min-width: 42px; }
  #navProps .idlbl { font-weight: bold; color: #00695c; font-size: 13px; }
  #navProps select, #navProps input[type=text] {
    flex: 1; padding: 3px; border: 1px solid #cfd8dc; border-radius: 4px; font-size: 12px;
  }
  #navProps button {
    width: 100%; padding: 5px; margin: 3px 0; border: 1px solid #cfd8dc;
    border-radius: 5px; background: #fafafa; cursor: pointer; font-size: 12px;
  }
  #navProps button.danger { background: #ffebee; border-color: #ef9a9a; color: #c62828; }
  #navProps .empty { color: #b0bec5; padding: 8px 2px; }

  /* 진행 방향별로 보이는 표지판 면(앞/뒤) 고르기 */
  .sideBox { margin: 7px 0 3px; padding: 6px; background: #f3e5f5; border-radius: 5px; }
  .sideBox h5 { margin: 0 0 5px; font-size: 11px; color: #6a1b9a; font-weight: bold; }
  .sideDir { margin-bottom: 7px; }
  .sideDir:last-child { margin-bottom: 0; }
  .sideDir .cap { font-size: 10.5px; color: #4a148c; margin-bottom: 3px; }
  .sideDir .cap b { color: #1b5e20; }
  .sidePick { display: flex; gap: 5px; }
  .sideOpt {
    flex: 1; border: 2px solid #d1c4e9; border-radius: 5px; background: #fff;
    padding: 3px; cursor: pointer; text-align: center; font-size: 10.5px; color: #78909c;
  }
  .sideOpt:hover { border-color: #9575cd; }
  .sideOpt.on { border-color: #6a1b9a; background: #ede7f6; color: #4a148c; font-weight: bold; }
  .sideOpt.none { opacity: .45; cursor: not-allowed; }
  .sideOpt img { display: block; width: 100%; height: 52px; object-fit: cover; border-radius: 3px; margin-bottom: 2px; }
  .sideOpt .noimg {
    display: block; height: 52px; line-height: 52px; border-radius: 3px;
    background: #eceff1; color: #b0bec5; font-size: 9.5px; margin-bottom: 2px;
  }
  /* 사이드바가 좁아 썸네일이 작으므로, 올려두면 큰 사진을 옆에 띄운다 */
  #sidePeek {
    position: fixed; z-index: 60; display: none; pointer-events: none;
    background: #fff; border: 2px solid #6a1b9a; border-radius: 6px; padding: 3px;
    box-shadow: 0 6px 22px rgba(0,0,0,.3);
  }
  #sidePeek img { display: block; width: 420px; max-height: 70vh; object-fit: contain; border-radius: 3px; }
  #sidePeek .cap { font-size: 11px; color: #4a148c; text-align: center; padding: 2px 0 1px; }
  #listTabs { display: flex; gap: 4px; margin: 4px 0; }
  #listTabs button {
    flex: 1; padding: 4px; border: 1px solid #cfd8dc; border-radius: 5px;
    background: #fafafa; cursor: pointer; font-size: 11.5px;
  }
  #listTabs button.on { background: #00897b; border-color: #00897b; color: #fff; font-weight: bold; }
  #listTabs button b { font-size: 12px; }
  #navList { max-height: 190px; overflow-y: auto; border: 1px solid #eceff1; border-radius: 5px; }
  #navList .row {
    display: flex; align-items: center; gap: 5px; padding: 4px 6px;
    border-bottom: 1px solid #f5f5f5; cursor: pointer; font-size: 11.5px;
  }
  #navList .row:last-child { border-bottom: none; }
  #navList .row:hover { background: #f5f5f5; }
  #navList .row.on { background: #e0f2f1; }
  #navList .row.orphan { background: #ffebee; }
  #navList .dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  }
  #navList .dot.sq { border-radius: 2px; }
  #navList .dot.di { border-radius: 2px; transform: rotate(45deg); }
  #navList .nid { font-weight: bold; color: #37474f; }
  #navList .meta { margin-left: auto; color: #b0bec5; font-size: 10.5px; white-space: nowrap; }
  #navList .empty { padding: 10px; color: #b0bec5; text-align: center; font-size: 11.5px; }
  #dijkBox { border-top: 1px solid #cfd8dc; margin-top: 6px; padding-top: 6px; }
  #dijkBox .res {
    background: #fff3e0; border-radius: 5px; padding: 6px; margin-top: 4px;
    font-size: 11.5px; color: #e65100; word-break: break-all; line-height: 1.5;
  }
</style>
</head>
<body>

<div id="topbar">
  <span class="title">🗺️ 대구역 2D 맵</span>
  <div id="floors"></div>
  <button class="act" id="btnAddFloor">＋ 층 추가</button>
  <div class="spacer"></div>
  <div id="modeTabs">
    <button id="tabMap" class="on">지도 편집</button>
    <button id="tabGraph">경로 편집</button>
  </div>
  <button class="act" id="btnUndo" title="Ctrl+Z">↩ 취소</button>
  <button class="act" id="btnRedo" title="Ctrl+Y">↪ 복구</button>
  <button class="act" id="btnFit">🔍 전체보기</button>
  <span style="display:flex;align-items:center;gap:3px;font-size:11px;color:#b0bec5">
    범위
    <select id="expRange" style="padding:3px;border-radius:4px;border:0;font-size:11px">
      <option value="view">현재 화면</option>
      <option value="content">전체 내용</option>
    </select>
    배율
    <select id="expScale" style="padding:3px;border-radius:4px;border:0;font-size:11px">
      <option value="2">2×</option>
      <option value="4" selected>4×</option>
      <option value="6">6×</option>
      <option value="8">8×</option>
    </select>
  </span>
  <button class="act primary" id="btnPng">📷 PNG 저장</button>
  <button class="act primary" id="btnSvg" title="지도 + 경로. 확대해도 깨지지 않는 벡터 이미지">🔷 SVG 저장</button>
  <button class="act primary" id="btnSvgMap" title="경로선 없이 지도만. 프론트에서 마커를 얹을 배경용">🔷 SVG (지도만)</button>
  <button class="act" id="btnJson">💾 저장(JSON)</button>
  <button class="act nav" id="btnNavJson">🧭 Navigation JSON</button>
  <button class="act nav" id="btnGraphPng">🕸 그래프 맵</button>
  <button class="act nav" id="btnMapGraphPng">🗺 지도+경로</button>
  <button class="act" id="btnLoad">📂 불러오기</button>
  <button class="act" id="btnNew">🗑 새 문서</button>
</div>

<div id="sidePeek"><img alt=""><div class="cap"></div></div>
<div id="main">
  <div id="side">
    <h4>도구</h4>
    <button class="tbtn" data-tool="select">🖱 선택/이동 <span class="key">V</span></button>
    <button class="tbtn" data-tool="wall">🧱 벽 그리기 <span class="key">W</span></button>
    <button class="tbtn" data-tool="area">▭ 영역(공간) <span class="key">A</span></button>
    <button class="tbtn" data-tool="arrow">➡ 화살표 <span class="key">R</span></button>
    <button class="tbtn" data-tool="sign">🪧 표지판 <span class="key">S</span></button>
    <button class="tbtn" data-tool="text">✏️ 텍스트 <span class="key">T</span></button>
    <button class="tbtn" data-tool="erase">🧹 지우개 <span class="key">E</span></button>
    <h4>시설 배치 (클릭 후 지도 클릭)</h4>
    <div id="facs"></div>
    <h4>옵션</h4>
    <label class="opt"><input type="checkbox" id="chkSnap" checked> 격자 스냅</label>
    <h4>배경 이미지 (따라 그리기)</h4>
    <button class="small" id="btnBg">이미지 불러오기…</button>
    <div id="bgCtrl" style="display:none">
      <div class="bgrow">투명도 <input type="range" id="bgOp" min="10" max="100" value="45"></div>
      <div class="bgrow">크기 <input type="range" id="bgSc" min="10" max="300" value="100"></div>
      <label class="opt"><input type="checkbox" id="chkBgExport"> PNG에 배경 포함</label>
      <button class="small" id="btnBgDel">배경 제거</button>
    </div>

    <!-- ===== 경로 편집 모드 사이드바 ===== -->
    <div id="navSide">
      <h4>경로 편집 도구</h4>
      <button class="tbtn nav-tbtn on" data-navtool="select">🖱 선택 / 형태 수정</button>
      <button class="tbtn nav-tbtn" data-navtool="node">📍 노드 등록</button>
      <button class="tbtn nav-tbtn" data-navtool="edge">🔗 엣지 연결</button>
      <div class="navinfo" id="navHint"></div>

      <h4>목록 <span style="font-weight:normal;color:#b0bec5">클릭하면 이동</span></h4>
      <div id="listTabs">
        <button data-list="node" class="on">노드 <b id="cntNode">0</b></button>
        <button data-list="edge">엣지 <b id="cntEdge">0</b></button>
      </div>
      <label class="opt"><input type="checkbox" id="chkListAll"> 전체 층 보기</label>
      <label class="opt"><input type="checkbox" id="chkSideTodo"> 🪧 면 미지정 엣지만</label>
      <div class="navinfo" id="sideStat" style="margin:2px 0 4px"></div>
      <div id="navList"></div>

      <div id="navProps"></div>

      <h4>내보내기 좌표</h4>
      <label class="opt"><input type="checkbox" id="chkNorm" checked> 0,0 기준으로 정규화</label>
      <div class="row" style="display:flex;align-items:center;gap:5px;margin:3px 0">
        <label style="color:#78909c;min-width:52px;font-size:12px">가로 크기</label>
        <input type="number" id="normW" placeholder="원본" min="100" step="100"
               style="width:74px;padding:3px 5px;border:1px solid #cfd8dc;border-radius:4px;font-size:12px">
        <span style="color:#b0bec5;font-size:10.5px">비우면 원본</span>
      </div>
      <div class="navinfo" id="normInfo" style="margin:2px 0 4px"></div>

      <h4>표시</h4>
      <label class="opt"><input type="checkbox" id="chkNavShow" checked> 그래프 표시</label>
      <label class="opt"><input type="checkbox" id="chkNavOnly"> 지도 흐리게</label>
      <label class="opt"><input type="checkbox" id="chkSideMark" checked> 🪧 면 지정 여부 (✓ / 남은 수)</label>

      <div id="dijkBox">
        <h4>테스트용 Dijkstra</h4>
        <div class="row"><label>출발</label><select id="dijkFrom"></select></div>
        <div class="row"><label>도착</label><select id="dijkTo"></select></div>
        <button id="btnDijk" style="width:100%;padding:5px;margin:3px 0;border:1px solid #cfd8dc;border-radius:5px;background:#fafafa;cursor:pointer;font-size:12px">최단경로 계산</button>
        <button id="btnDijkClear" style="width:100%;padding:5px;margin:3px 0;border:1px solid #cfd8dc;border-radius:5px;background:#fafafa;cursor:pointer;font-size:12px">경로 지우기</button>
        <div class="res" id="dijkRes" style="display:none"></div>
      </div>
    </div>
  </div>
  <div id="wrap">
    <canvas id="cv"></canvas>
    <input id="txtIn" placeholder="텍스트 입력 후 Enter">
  </div>
</div>

<div id="props"></div>

<div id="status">
  <span id="hint"></span>
  <span class="zoom" id="zoomLbl">100%</span>
</div>

<input type="file" id="fileJson" accept=".json" hidden>
<input type="file" id="fileBg" accept="image/*" hidden>

<script>
'use strict';

// ===== 상수 =====
const GRID = 20;
const LS_KEY = 'daegu-map-editor-v1';
const FACS = [
  ['GA','⛩','개찰구','#d81b60'],
  ['ST','🪜','계단/에스컬레이터','#7b1fa2'],
  ['EV','🛗','엘리베이터','#00897b'],
  ['TO','🚻','화장실','#1976d2'],
  ['EX','🚪','출구','#2e7d32'],
  ['TI','🎟','매표소','#6d4c41'],
  ['BO','🎫','승차권 발매기','#455a64'],
  ['TH','💺','대합실','#0288d1'],
  ['CO','🏪','편의점','#f57c00'],
  ['AT','🏧','ATM','#ef6c00'],
];
const FAC_MAP = {};
FACS.forEach(f => FAC_MAP[f[0]] = f);

const HINTS = {
  select: '클릭: 선택 · 빈 곳 드래그: 범위 선택 · 드래그: 이동 · Ctrl+드래그: 복사 · Shift+클릭: 추가 선택 · 우클릭 드래그: 화면 이동 · Del: 삭제',
  wall:   '클릭으로 벽의 꼭짓점을 이어서 찍고, 더블클릭·Enter·우클릭으로 완료 (Esc 취소)',
  area:   '드래그하여 사각형 영역을 그립니다 (통로, 대합실 등 공간 표시)',
  arrow:  '드래그하여 화살표를 그립니다 (누른 곳 → 놓은 곳 방향)',
  sign:   '클릭한 위치에 표지판 마커가 생성되고 ID가 자동 부여됩니다 (예: S1_01)',
  text:   '클릭한 위치에 텍스트를 입력합니다',
  erase:  '클릭한 객체를 삭제합니다',
  fac:    '클릭한 위치에 시설 아이콘을 배치합니다',
};

// ===== 상태 =====
function newFloor(code) {
  return { code, signN: 0, bg: null, bgOp: 0.45, bgSc: 1, bgExport: false, objects: [] };
}
let state = { floors: [newFloor('1')], cur: 0 };
let view = { x: 80, y: 60, scale: 1 };
let tool = 'select';
let facCode = null;
let selSet = [];   // 선택된 객체 인덱스 목록
let undoStack = [], redoStack = [];
function isSel(i) { return selSet.indexOf(i) >= 0; }
function singleSel() { return selSet.length === 1 ? selSet[0] : -1; }
function deleteSelected() {
  if (!selSet.length) return;
  pushUndo();
  selSet.slice().sort((a, b) => b - a).forEach(i => objs().splice(i, 1));
  selSet = [];
  renderProps(); draw(); autosave();
}
let bgImgCache = {};   // floorIndex -> HTMLImageElement

// 임시 상호작용 상태
let tempWall = [];          // 벽 그리는 중 점 목록
let mouseW = { x: 0, y: 0 }; // 월드 좌표 마우스 위치
let drag = null;            // {mode:'pan'|'move'|'area', ...}
let pendingTextPos = null;  // 텍스트 입력 위치(월드)
let editingTextIdx = -1;    // 기존 텍스트 수정 중이면 인덱스

// ===== DOM =====
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const wrap = document.getElementById('wrap');
const txtIn = document.getElementById('txtIn');
const propsEl = document.getElementById('props');
const hintEl = document.getElementById('hint');
const zoomLbl = document.getElementById('zoomLbl');

function floor() { return state.floors[state.cur]; }
function objs() { return floor().objects; }
function snapOn() { return document.getElementById('chkSnap').checked; }
function snap(v) { return snapOn() ? Math.round(v / GRID) * GRID : v; }

// ===== 저장 / 복원 =====
let saveTimer = null;
function autosave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); }
    catch (e) { /* 용량 초과 시 배경 제외 저장 시도 */
      try {
        const slim = JSON.parse(JSON.stringify(state));
        slim.floors.forEach(f => f.bg = null);
        localStorage.setItem(LS_KEY, JSON.stringify(slim));
      } catch (e2) {}
    }
  }, 400);
}
function pushUndo() {
  undoStack.push(JSON.stringify(state));
  if (undoStack.length > 60) undoStack.shift();
  redoStack = [];
}
function undo() {
  if (!undoStack.length) return;
  redoStack.push(JSON.stringify(state));
  state = JSON.parse(undoStack.pop());
  afterStateSwap();
}
function redo() {
  if (!redoStack.length) return;
  undoStack.push(JSON.stringify(state));
  state = JSON.parse(redoStack.pop());
  afterStateSwap();
}
function afterStateSwap() {
  if (state.cur >= state.floors.length) state.cur = state.floors.length - 1;
  selSet = []; tempWall = []; bgImgCache = {};
  renderFloors(); renderProps(); renderBgCtrl(); loadBgImage(); draw(); autosave();
}

// ===== 좌표 변환 =====
function s2w(sx, sy) { return { x: (sx - view.x) / view.scale, y: (sy - view.y) / view.scale }; }
function w2s(wx, wy) { return { x: wx * view.scale + view.x, y: wy * view.scale + view.y }; }
function evPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

// ===== 캔버스 크기 =====
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const r = wrap.getBoundingClientRect();
  cv.width = Math.max(1, Math.round(r.width * dpr));
  cv.height = Math.max(1, Math.round(r.height * dpr));
  draw();
}
window.addEventListener('resize', resize);

// ===== 그리기 =====
function draw() {
  const dpr = window.devicePixelRatio || 1;
  const W = cv.width / dpr, H = cv.height / dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#fafafa';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(view.x, view.y);
  ctx.scale(view.scale, view.scale);

  drawBg(ctx);
  drawGrid(ctx, W, H);
  drawObjects(ctx, { selection: true });
  drawTempWall(ctx);

  ctx.restore();
  zoomLbl.textContent = Math.round(view.scale * 100) + '%';
}

function drawBg(c) {
  const f = floor();
  const img = bgImgCache[state.cur];
  if (f.bg && img && img.complete) {
    c.save();
    c.globalAlpha = f.bgOp;
    c.drawImage(img, 0, 0, img.width * f.bgSc, img.height * f.bgSc);
    c.restore();
  }
}

function drawGrid(c, W, H) {
  const tl = s2w(0, 0), br = s2w(W, H);
  let step = GRID;
  if (step * view.scale < 8) step = GRID * 5;
  const x0 = Math.floor(tl.x / step) * step, x1 = br.x;
  const y0 = Math.floor(tl.y / step) * step, y1 = br.y;
  c.lineWidth = 1 / view.scale;
  for (let x = x0; x <= x1; x += step) {
    c.strokeStyle = (x % (GRID * 5) === 0) ? '#dde3e6' : '#eef1f3';
    c.beginPath(); c.moveTo(x, tl.y); c.lineTo(x, br.y); c.stroke();
  }
  for (let y = y0; y <= y1; y += step) {
    c.strokeStyle = (y % (GRID * 5) === 0) ? '#dde3e6' : '#eef1f3';
    c.beginPath(); c.moveTo(tl.x, y); c.lineTo(br.x, y); c.stroke();
  }
}

function drawObjects(c, opt) {
  const list = objs();
  // 영역 → 벽 → 시설 → 표지판 → 텍스트 순서로 그림
  list.forEach((o, i) => { if (o.type === 'area') drawArea(c, o, opt && opt.selection && isSel(i)); });
  list.forEach((o, i) => { if (o.type === 'wall') drawWall(c, o, opt && opt.selection && isSel(i)); });
  list.forEach((o, i) => { if (o.type === 'arrow') drawArrow(c, o, opt && opt.selection && isSel(i)); });
  list.forEach((o, i) => { if (o.type === 'facility') drawFac(c, o, opt && opt.selection && isSel(i)); });
  list.forEach((o, i) => { if (o.type === 'sign') drawSign(c, o, opt && opt.selection && isSel(i)); });
  list.forEach((o, i) => { if (o.type === 'text') drawText(c, o, opt && opt.selection && isSel(i)); });
}

function drawArea(c, o, sel) {
  c.fillStyle = hexA(o.color || '#64b5f6', 0.18);
  c.fillRect(o.x, o.y, o.w, o.h);
  c.strokeStyle = o.color || '#64b5f6';
  c.lineWidth = 2;
  c.setLineDash([6, 4]);
  c.strokeRect(o.x, o.y, o.w, o.h);
  c.setLineDash([]);
  if (o.label) {
    c.fillStyle = shade(o.color || '#64b5f6');
    c.font = 'bold 14px "Malgun Gothic", sans-serif';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(o.label, o.x + o.w / 2, o.y + o.h / 2);
  }
  if (sel) selRect(c, o.x - 4, o.y - 4, o.w + 8, o.h + 8);
}

function drawWall(c, o, sel) {
  c.strokeStyle = o.color || '#37474f';
  c.lineWidth = o.width || 6;
  c.lineJoin = 'round'; c.lineCap = 'round';
  c.beginPath();
  o.points.forEach((p, i) => i ? c.lineTo(p.x, p.y) : c.moveTo(p.x, p.y));
  c.stroke();
  if (sel) {
    c.fillStyle = '#1e88e5';
    o.points.forEach(p => { c.beginPath(); c.arc(p.x, p.y, 5, 0, 7); c.fill(); });
  }
}

function drawArrow(c, o, sel) {
  const a = o.points[0], b = o.points[1];
  const w = o.width || 4;
  const col = o.color || '#e53935';
  const ang = Math.atan2(b.y - a.y, b.x - a.x);
  const hl = Math.max(14, w * 3.5); // 화살촉 길이
  const hx = b.x - hl * 0.7 * Math.cos(ang), hy = b.y - hl * 0.7 * Math.sin(ang);
  c.strokeStyle = col;
  c.lineWidth = w;
  c.lineCap = 'round';
  c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(hx, hy); c.stroke();
  c.fillStyle = col;
  c.beginPath();
  c.moveTo(b.x, b.y);
  c.lineTo(b.x - hl * Math.cos(ang - 0.45), b.y - hl * Math.sin(ang - 0.45));
  c.lineTo(b.x - hl * Math.cos(ang + 0.45), b.y - hl * Math.sin(ang + 0.45));
  c.closePath(); c.fill();
  if (sel) {
    c.fillStyle = '#1e88e5';
    o.points.forEach(p => { c.beginPath(); c.arc(p.x, p.y, 5, 0, 7); c.fill(); });
  }
}

function drawFac(c, o, sel) {
  const f = FAC_MAP[o.code] || ['??', '❓', '', '#777'];
  const S = 42, h = S / 2;
  c.fillStyle = f[3];
  roundRect(c, o.x - h, o.y - h, S, S, 8);
  c.fill();
  c.font = '17px "Segoe UI Emoji", sans-serif';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(f[1], o.x, o.y - 7);
  c.fillStyle = '#fff';
  c.font = 'bold 11px "Segoe UI", sans-serif';
  c.fillText(f[0], o.x, o.y + 12);
  if (sel) selRect(c, o.x - h - 4, o.y - h - 4, S + 8, S + 8);
}

function drawSign(c, o, sel) {
  c.fillStyle = '#ffb300';
  c.strokeStyle = '#e65100';
  c.lineWidth = 2.5;
  c.beginPath(); c.arc(o.x, o.y, 19, 0, 7); c.fill(); c.stroke();
  c.fillStyle = '#4e2600';
  c.font = 'bold 19px "Segoe UI", sans-serif';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('S', o.x, o.y + 1);
  // ID 라벨
  c.font = 'bold 15px "Segoe UI", sans-serif';
  const w = c.measureText(o.id).width + 14;
  c.fillStyle = '#fff';
  c.strokeStyle = '#e65100';
  c.lineWidth = 1.5;
  roundRect(c, o.x - w / 2, o.y + 24, w, 24, 5);
  c.fill(); c.stroke();
  c.fillStyle = '#bf360c';
  c.fillText(o.id, o.x, o.y + 36);
  if (sel) selRect(c, o.x - 25, o.y - 25, 50, 76);
}

function drawText(c, o, sel) {
  c.fillStyle = o.color || '#212121';
  c.font = 'bold ' + (o.size || 16) + 'px "Malgun Gothic", sans-serif';
  c.textAlign = 'left'; c.textBaseline = 'top';
  c.fillText(o.text, o.x, o.y);
  if (sel) {
    const w = c.measureText(o.text).width;
    selRect(c, o.x - 3, o.y - 3, w + 6, (o.size || 16) * 1.25 + 6);
  }
}

function drawTempWall(c) {
  if (tool !== 'wall' || !tempWall.length) return;
  c.strokeStyle = '#1e88e5';
  c.lineWidth = 5;
  c.lineJoin = 'round'; c.lineCap = 'round';
  c.setLineDash([8, 5]);
  c.beginPath();
  tempWall.forEach((p, i) => i ? c.lineTo(p.x, p.y) : c.moveTo(p.x, p.y));
  c.lineTo(snap(mouseW.x), snap(mouseW.y));
  c.stroke();
  c.setLineDash([]);
  c.fillStyle = '#1e88e5';
  tempWall.forEach(p => { c.beginPath(); c.arc(p.x, p.y, 4, 0, 7); c.fill(); });
}

function selRect(c, x, y, w, h) {
  c.strokeStyle = '#1e88e5';
  c.lineWidth = 1.5;
  c.setLineDash([4, 3]);
  c.strokeRect(x, y, w, h);
  c.setLineDash([]);
}
function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
function shade(hex) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgb(' + Math.round((n >> 16) * 0.55) + ',' + Math.round(((n >> 8) & 255) * 0.55) + ',' + Math.round((n & 255) * 0.55) + ')';
}

// ===== 히트 테스트 =====
function objBounds(o) {
  if (o.type === 'area') return { x: o.x, y: o.y, w: o.w, h: o.h };
  if (o.type === 'facility') return { x: o.x - 21, y: o.y - 21, w: 42, h: 42 };
  if (o.type === 'sign') return { x: o.x - 24, y: o.y - 24, w: 48, h: 74 };
  if (o.type === 'text') {
    ctx.font = 'bold ' + (o.size || 16) + 'px "Malgun Gothic", sans-serif';
    const w = ctx.measureText(o.text).width;
    return { x: o.x, y: o.y, w, h: (o.size || 16) * 1.3 };
  }
  if (o.type === 'wall' || o.type === 'arrow') {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    o.points.forEach(p => { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); });
    const m = (o.width || 6) / 2 + 2;
    return { x: x0 - m, y: y0 - m, w: x1 - x0 + m * 2, h: y1 - y0 + m * 2 };
  }
  return { x: 0, y: 0, w: 0, h: 0 };
}
function inBounds(p, b) { return p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h; }
function distSeg(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const L2 = dx * dx + dy * dy;
  let t = L2 ? ((p.x - a.x) * dx + (p.y - a.y) * dy) / L2 : 0;
  t = Math.max(0, Math.min(1, t));
  const px = a.x + t * dx, py = a.y + t * dy;
  return Math.hypot(p.x - px, p.y - py);
}
function hitTest(p) {
  const list = objs();
  const order = ['text', 'sign', 'facility', 'arrow', 'wall', 'area'];
  for (const ty of order) {
    for (let i = list.length - 1; i >= 0; i--) {
      const o = list[i];
      if (o.type !== ty) continue;
      if (ty === 'wall' || ty === 'arrow') {
        const tol = (o.width || 6) / 2 + 6 / view.scale;
        for (let k = 0; k < o.points.length - 1; k++)
          if (distSeg(p, o.points[k], o.points[k + 1]) <= tol) return i;
      } else if (inBounds(p, objBounds(o))) return i;
    }
  }
  return -1;
}

// ===== 포인터 이벤트 =====
cv.addEventListener('pointerdown', e => {
  if (txtIn.style.display === 'block') commitText();
  cv.setPointerCapture(e.pointerId);
  const s = evPos(e);
  const p = s2w(s.x, s.y);
  mouseW = p;

  // 가운데/우측 버튼: 항상 화면 이동
  if (e.button === 1 || e.button === 2) {
    if (e.button === 2 && tool === 'wall' && tempWall.length) return; // 우클릭=벽 완료
    drag = { mode: 'pan', sx: s.x, sy: s.y, vx: view.x, vy: view.y };
    e.preventDefault();
    return;
  }

  if (tool === 'wall') {
    tempWall.push({ x: snap(p.x), y: snap(p.y) });
    draw();
    return;
  }
  if (tool === 'area') {
    drag = { mode: 'area', x0: snap(p.x), y0: snap(p.y), x1: snap(p.x), y1: snap(p.y) };
    return;
  }
  if (tool === 'arrow') {
    drag = { mode: 'arrowdraw', x0: snap(p.x), y0: snap(p.y), x1: snap(p.x), y1: snap(p.y) };
    return;
  }
  if (tool === 'sign') {
    pushUndo();
    const f = floor();
    f.signN++;
    objs().push({ type: 'sign', x: snap(p.x), y: snap(p.y), id: 'S' + f.code + '_' + String(f.signN).padStart(2, '0') });
    selSet = [objs().length - 1];
    renderProps(); draw(); autosave();
    return;
  }
  if (tool === 'fac' && facCode) {
    pushUndo();
    objs().push({ type: 'facility', code: facCode, x: snap(p.x), y: snap(p.y) });
    draw(); autosave();
    return;
  }
  if (tool === 'text') {
    openTextInput(s, p, -1);
    return;
  }
  if (tool === 'erase') {
    const i = hitTest(p);
    if (i >= 0) { pushUndo(); objs().splice(i, 1); selSet = []; renderProps(); draw(); autosave(); }
    return;
  }
  // select
  const i = hitTest(p);
  if (i >= 0) {
    if (e.shiftKey) {
      // Shift+클릭: 선택 추가/해제
      if (isSel(i)) selSet = selSet.filter(x => x !== i);
      else selSet.push(i);
      renderProps(); draw();
      return;
    }
    if (!isSel(i)) selSet = [i];
    drag = {
      mode: 'move', px: p.x, py: p.y, moved: false,
      copy: e.ctrlKey || e.altKey,   // Ctrl/Alt+드래그: 복사
      origs: selSet.map(idx => ({ idx, json: JSON.stringify(objs()[idx]) })),
    };
    renderProps(); draw();
  } else {
    selSet = [];
    drag = { mode: 'marquee', x0: p.x, y0: p.y, x1: p.x, y1: p.y };
    renderProps(); draw();
  }
});

cv.addEventListener('pointermove', e => {
  const s = evPos(e);
  const p = s2w(s.x, s.y);
  mouseW = p;

  if (!drag) {
    if (tool === 'wall' && tempWall.length) draw();
    return;
  }
  if (drag.mode === 'pan') {
    view.x = drag.vx + (s.x - drag.sx);
    view.y = drag.vy + (s.y - drag.sy);
    draw();
  } else if (drag.mode === 'area') {
    drag.x1 = snap(p.x); drag.y1 = snap(p.y);
    draw();
    // 미리보기
    ctx.save();
    const dpr = window.devicePixelRatio || 1;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.translate(view.x, view.y); ctx.scale(view.scale, view.scale);
    ctx.strokeStyle = '#1e88e5'; ctx.lineWidth = 2; ctx.setLineDash([6, 4]);
    ctx.strokeRect(Math.min(drag.x0, drag.x1), Math.min(drag.y0, drag.y1),
                   Math.abs(drag.x1 - drag.x0), Math.abs(drag.y1 - drag.y0));
    ctx.restore();
  } else if (drag.mode === 'arrowdraw') {
    drag.x1 = snap(p.x); drag.y1 = snap(p.y);
    draw();
    // 화살표 미리보기
    ctx.save();
    const dpr2 = window.devicePixelRatio || 1;
    ctx.setTransform(dpr2, 0, 0, dpr2, 0, 0);
    ctx.translate(view.x, view.y); ctx.scale(view.scale, view.scale);
    drawArrow(ctx, { points: [{ x: drag.x0, y: drag.y0 }, { x: drag.x1, y: drag.y1 }], width: 4 }, false);
    ctx.restore();
  } else if (drag.mode === 'marquee') {
    drag.x1 = p.x; drag.y1 = p.y;
    draw();
    // 범위 선택 미리보기
    ctx.save();
    const dpr = window.devicePixelRatio || 1;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.translate(view.x, view.y); ctx.scale(view.scale, view.scale);
    const rx = Math.min(drag.x0, drag.x1), ry = Math.min(drag.y0, drag.y1);
    const rw = Math.abs(drag.x1 - drag.x0), rh = Math.abs(drag.y1 - drag.y0);
    ctx.fillStyle = 'rgba(30,136,229,0.08)';
    ctx.fillRect(rx, ry, rw, rh);
    ctx.strokeStyle = '#1e88e5';
    ctx.lineWidth = 1.5 / view.scale;
    ctx.setLineDash([5, 4]);
    ctx.strokeRect(rx, ry, rw, rh);
    ctx.setLineDash([]);
    ctx.restore();
  } else if (drag.mode === 'move') {
    const dx = p.x - drag.px, dy = p.y - drag.py;
    if (!drag.moved && Math.hypot(dx, dy) * view.scale > 3) {
      drag.moved = true;
      pushUndo(); // 아직 이동 전 상태이므로 스냅샷 그대로 사용
      if (drag.copy) {
        // 원본은 제자리에 두고, 복사본을 만들어 그것을 끌고 간다
        const f = floor();
        const newSel = [];
        drag.origs = drag.origs.map(({ json }) => {
          const clone = JSON.parse(json);
          if (clone.type === 'sign') {
            f.signN++;
            clone.id = 'S' + f.code + '_' + String(f.signN).padStart(2, '0');
          }
          objs().push(clone);
          const ni = objs().length - 1;
          newSel.push(ni);
          return { idx: ni, json: JSON.stringify(clone) };
        });
        selSet = newSel;
        renderProps();
      }
    }
    if (drag.moved) {
      drag.origs.forEach(({ idx, json }) => {
        const o = objs()[idx];
        const base = JSON.parse(json);
        if (o.type === 'wall' || o.type === 'arrow') {
          o.points = base.points.map(pt => ({ x: snap(pt.x + dx), y: snap(pt.y + dy) }));
        } else {
          o.x = snap(base.x + dx);
          o.y = snap(base.y + dy);
        }
      });
      draw();
    }
  }
});

cv.addEventListener('pointerup', e => {
  if (!drag) return;
  if (drag.mode === 'area') {
    const x = Math.min(drag.x0, drag.x1), y = Math.min(drag.y0, drag.y1);
    const w = Math.abs(drag.x1 - drag.x0), h = Math.abs(drag.y1 - drag.y0);
    if (w > 8 && h > 8) {
      pushUndo();
      objs().push({ type: 'area', x, y, w, h, color: '#64b5f6', label: '' });
      selSet = [objs().length - 1];
      renderProps();
    }
    draw(); autosave();
  } else if (drag.mode === 'arrowdraw') {
    if (Math.hypot(drag.x1 - drag.x0, drag.y1 - drag.y0) > 8) {
      pushUndo();
      objs().push({ type: 'arrow', points: [{ x: drag.x0, y: drag.y0 }, { x: drag.x1, y: drag.y1 }], width: 4, color: '#e53935' });
      selSet = [objs().length - 1];
      renderProps();
      autosave();
    }
    draw();
  } else if (drag.mode === 'marquee') {
    const rx = Math.min(drag.x0, drag.x1), ry = Math.min(drag.y0, drag.y1);
    const rw = Math.abs(drag.x1 - drag.x0), rh = Math.abs(drag.y1 - drag.y0);
    if (rw * view.scale > 4 || rh * view.scale > 4) {
      selSet = [];
      objs().forEach((o, i) => {
        const b = objBounds(o);
        if (b.x < rx + rw && b.x + b.w > rx && b.y < ry + rh && b.y + b.h > ry) selSet.push(i);
      });
    }
    renderProps(); draw();
  } else if (drag.mode === 'move' && drag.moved) {
    autosave();
  }
  drag = null;
});

cv.addEventListener('dblclick', e => {
  const s = evPos(e);
  const p = s2w(s.x, s.y);
  if (tool === 'wall') { finishWall(); return; }
  if (tool === 'select') {
    const i = hitTest(p);
    if (i >= 0 && objs()[i].type === 'text') openTextInput(w2sPt(objs()[i]), p, i);
  }
});
function w2sPt(o) { return w2s(o.x, o.y); }

cv.addEventListener('contextmenu', e => {
  e.preventDefault();
  if (tool === 'wall' && tempWall.length) finishWall();
});

cv.addEventListener('wheel', e => {
  e.preventDefault();
  const s = evPos(e);
  const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  const ns = Math.max(0.08, Math.min(8, view.scale * factor));
  const w = s2w(s.x, s.y);
  view.scale = ns;
  view.x = s.x - w.x * ns;
  view.y = s.y - w.y * ns;
  draw();
}, { passive: false });

function finishWall() {
  if (tempWall.length >= 2) {
    pushUndo();
    objs().push({ type: 'wall', points: tempWall.slice(), width: 6, color: '#37474f' });
    autosave();
  }
  tempWall = [];
  draw();
}

// ===== 텍스트 입력 =====
function openTextInput(screenPos, worldPos, editIdx) {
  pendingTextPos = worldPos;
  editingTextIdx = editIdx;
  txtIn.style.left = screenPos.x + 'px';
  txtIn.style.top = screenPos.y + 'px';
  txtIn.value = editIdx >= 0 ? objs()[editIdx].text : '';
  txtIn.style.display = 'block';
  setTimeout(() => txtIn.focus(), 0);
}
function commitText() {
  const v = txtIn.value.trim();
  txtIn.style.display = 'none';
  if (editingTextIdx >= 0) {
    if (v && v !== objs()[editingTextIdx].text) {
      pushUndo();
      objs()[editingTextIdx].text = v;
      autosave();
    }
  } else if (v && pendingTextPos) {
    pushUndo();
    objs().push({ type: 'text', x: snap(pendingTextPos.x), y: snap(pendingTextPos.y), text: v, size: 16, color: '#212121' });
    selSet = [objs().length - 1];
    renderProps();
    autosave();
  }
  editingTextIdx = -1; pendingTextPos = null;
  draw();
}
txtIn.addEventListener('keydown', e => {
  e.stopPropagation();
  if (e.key === 'Enter') commitText();
  if (e.key === 'Escape') { txtIn.style.display = 'none'; editingTextIdx = -1; pendingTextPos = null; }
});

// 선택 객체 크기 조절 (선택 영역 중심 기준)
function scaleHtml() {
  return '<label>크기 <input type="number" id="pScale" value="150" min="10" max="1000" style="width:60px">%</label>' +
    '<button class="mv" id="pScaleGo">적용</button>';
}
function bindScale() {
  const inp = document.getElementById('pScale');
  if (!inp) return;
  const go = () => scaleSelection((+inp.value || 100) / 100);
  document.getElementById('pScaleGo').addEventListener('click', go);
  inp.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') go(); });
}
function scaleSelection(factor) {
  if (!selSet.length || !(factor > 0) || factor === 1) return;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  selSet.forEach(i => {
    const b = objBounds(objs()[i]);
    x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y);
    x1 = Math.max(x1, b.x + b.w); y1 = Math.max(y1, b.y + b.h);
  });
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const S = v => Math.round(v * 100) / 100;
  const tx = x => S(cx + (x - cx) * factor);
  const ty = y => S(cy + (y - cy) * factor);
  pushUndo();
  selSet.forEach(i => {
    const o = objs()[i];
    if (o.type === 'wall' || o.type === 'arrow') {
      o.points = o.points.map(p => ({ x: tx(p.x), y: ty(p.y) }));
    } else if (o.type === 'area') {
      const nx = tx(o.x), ny = ty(o.y);
      o.w = S(o.w * factor); o.h = S(o.h * factor);
      o.x = nx; o.y = ny;
    } else {
      // 시설·표지판·텍스트는 위치만 이동 (아이콘/글자 크기는 유지해 다른 구역과 통일)
      o.x = tx(o.x); o.y = ty(o.y);
    }
  });
  draw(); autosave();
}

// 선택 객체 회전 (선택 영역 중심 기준)
function rotateHtml() {
  return '<label>회전 <input type="number" id="pRot" value="90" min="1" max="359" style="width:52px">°</label>' +
    '<button class="mv" id="pRotL" title="반시계 방향">↺</button>' +
    '<button class="mv" id="pRotR" title="시계 방향">↻</button>';
}
function bindRotate() {
  const inp = document.getElementById('pRot');
  if (!inp) return;
  inp.addEventListener('keydown', e => e.stopPropagation());
  document.getElementById('pRotL').addEventListener('click', () => rotateSelection(-(+inp.value || 90)));
  document.getElementById('pRotR').addEventListener('click', () => rotateSelection(+inp.value || 90));
}
function rotateSelection(deg) {
  if (!selSet.length || !deg) return;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  selSet.forEach(i => {
    const b = objBounds(objs()[i]);
    x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y);
    x1 = Math.max(x1, b.x + b.w); y1 = Math.max(y1, b.y + b.h);
  });
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const rad = deg * Math.PI / 180;
  const cos = Math.cos(rad), sin = Math.sin(rad);
  const S = v => Math.round(v * 100) / 100;
  const R = pt => ({ x: S(cx + (pt.x - cx) * cos - (pt.y - cy) * sin), y: S(cy + (pt.x - cx) * sin + (pt.y - cy) * cos) });
  const quarter = ((deg % 180) + 180) % 180 === 90; // 90도 단위 회전이면 영역의 가로/세로를 맞바꿈
  pushUndo();
  selSet.forEach(i => {
    const o = objs()[i];
    if (o.type === 'wall' || o.type === 'arrow') {
      o.points = o.points.map(R);
    } else if (o.type === 'area') {
      const c1 = R({ x: o.x + o.w / 2, y: o.y + o.h / 2 });
      let w = o.w, h = o.h;
      if (quarter) { w = o.h; h = o.w; }
      o.x = S(c1.x - w / 2); o.y = S(c1.y - h / 2);
      o.w = w; o.h = h;
    } else {
      // 시설·표지판·텍스트는 위치만 회전 (아이콘/글자는 항상 똑바로 표시)
      const p = R({ x: o.x, y: o.y });
      o.x = p.x; o.y = p.y;
    }
  });
  draw(); autosave();
}

// 다른 층으로 이동/복사 UI (층이 2개 이상일 때만)
function floorMoveHtml() {
  if (state.floors.length < 2) return '';
  let opts = '';
  state.floors.forEach((f, i) => {
    if (i !== state.cur) opts += '<option value="' + i + '">' + floorLabel(f.code) + '</option>';
  });
  return '<label>다른 층으로 <select id="pFloor">' + opts + '</select></label>' +
    '<button class="mv" id="pMove">➡ 이동</button>' +
    '<button class="mv" id="pCopy">⧉ 복사</button>';
}
function bindFloorMove() {
  const selEl = document.getElementById('pFloor');
  if (!selEl) return;
  document.getElementById('pMove').addEventListener('click', () => transferSel(+selEl.value, true));
  document.getElementById('pCopy').addEventListener('click', () => transferSel(+selEl.value, false));
}
function transferSel(ti, move) {
  if (!selSet.length || ti === state.cur || !state.floors[ti]) return;
  pushUndo();
  const tf = state.floors[ti];
  // 복사본 생성 (표지판은 대상 층 기준으로 새 ID 부여)
  const items = selSet.slice().sort((a, b) => a - b).map(i => JSON.parse(JSON.stringify(objs()[i])));
  items.forEach(o => {
    if (o.type === 'sign') {
      tf.signN++;
      o.id = 'S' + tf.code + '_' + String(tf.signN).padStart(2, '0');
    }
    tf.objects.push(o);
  });
  if (move) {
    // 원래 층에서 제거 후 대상 층으로 화면 전환, 옮긴 객체 선택 유지
    selSet.slice().sort((a, b) => b - a).forEach(i => objs().splice(i, 1));
    state.cur = ti;
    const n = tf.objects.length;
    selSet = items.map((_, k) => n - items.length + k);
    tempWall = [];
    renderFloors(); renderBgCtrl(); loadBgImage();
  }
  renderProps(); draw(); autosave();
}

function renderProps() {
  if (selSet.length > 1) {
    propsEl.className = 'show';
    propsEl.innerHTML = '<span class="pt">✔ ' + selSet.length + '개 선택됨</span>' +
      scaleHtml() +
      rotateHtml() +
      floorMoveHtml() +
      '<button class="del" id="pDel">🗑 모두 삭제</button>';
    bindScale();
    bindRotate();
    bindFloorMove();
    document.getElementById('pDel').addEventListener('click', deleteSelected);
    return;
  }
  const si = singleSel();
  const o = si >= 0 ? objs()[si] : null;
  if (!o) { propsEl.className = ''; propsEl.innerHTML = ''; return; }
  propsEl.className = 'show';
  let html = '';
  if (o.type === 'sign') {
    html = '<span class="pt">🪧 표지판</span>' +
      '<label>위치 ID <input type="text" id="pId" value="' + esc(o.id) + '"></label>';
  } else if (o.type === 'text') {
    html = '<span class="pt">✏️ 텍스트</span>' +
      '<label>내용 <input type="text" id="pTxt" value="' + esc(o.text) + '"></label>' +
      '<label>크기 <input type="number" id="pSize" value="' + (o.size || 16) + '" min="8" max="80"></label>' +
      '<label>색 <input type="color" id="pCol" value="' + (o.color || '#212121') + '"></label>';
  } else if (o.type === 'area') {
    html = '<span class="pt">▭ 영역</span>' +
      '<label>이름 <input type="text" id="pLabel" value="' + esc(o.label || '') + '" placeholder="예: 대합실"></label>' +
      '<label>색 <input type="color" id="pCol" value="' + (o.color || '#64b5f6') + '"></label>';
  } else if (o.type === 'wall' || o.type === 'arrow') {
    html = '<span class="pt">' + (o.type === 'wall' ? '🧱 벽' : '➡ 화살표') + '</span>' +
      '<label>두께 <input type="number" id="pW" value="' + (o.width || (o.type === 'wall' ? 6 : 4)) + '" min="2" max="30"></label>' +
      '<label>색 <input type="color" id="pCol" value="' + (o.color || (o.type === 'wall' ? '#37474f' : '#e53935')) + '"></label>';
  } else if (o.type === 'facility') {
    const f = FAC_MAP[o.code];
    html = '<span class="pt">' + (f ? f[1] + ' ' + f[2] + ' (' + f[0] + ')' : o.code) + '</span>';
  }
  html += scaleHtml();
  html += rotateHtml();
  html += floorMoveHtml();
  html += '<button class="del" id="pDel">🗑 삭제</button>';
  propsEl.innerHTML = html;
  bindScale();
  bindRotate();
  bindFloorMove();

  const bind = (id, fn) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('focus', () => pushUndo());
    el.addEventListener('input', () => { fn(el); draw(); autosave(); });
  };
  bind('pId',    el => { o.id = el.value; });
  bind('pTxt',   el => { o.text = el.value; });
  bind('pSize',  el => { o.size = Math.max(8, +el.value || 16); });
  bind('pLabel', el => { o.label = el.value; });
  bind('pW',     el => { o.width = Math.max(2, +el.value || 6); });
  bind('pCol',   el => { o.color = el.value; });
  document.getElementById('pDel').addEventListener('click', deleteSelected);
}
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

// ===== 층 관리 =====
function floorLabel(code) { return /^B/i.test(code) ? code.toUpperCase() : code + 'F'; }
function renderFloors() {
  const el = document.getElementById('floors');
  el.innerHTML = '';
  state.floors.forEach((f, i) => {
    const b = document.createElement('button');
    b.className = 'ftab' + (i === state.cur ? ' on' : '');
    b.textContent = floorLabel(f.code);
    if (state.floors.length > 1 && i === state.cur) {
      const x = document.createElement('span');
      x.className = 'x';
      x.textContent = '×';
      x.title = '이 층 삭제';
      x.addEventListener('click', ev => {
        ev.stopPropagation();
        if (!confirm(floorLabel(f.code) + ' 층을 삭제할까요? 이 층의 모든 내용이 사라집니다.')) return;
        pushUndo();
        state.floors.splice(i, 1);
        state.cur = Math.max(0, i - 1);
        selSet = []; bgImgCache = {};
        renderFloors(); renderProps(); renderBgCtrl(); loadBgImage(); draw(); autosave();
      });
      b.appendChild(x);
    }
    b.addEventListener('click', () => {
      if (state.cur === i) return;
      state.cur = i;
      selSet = []; tempWall = [];
      renderFloors(); renderProps(); renderBgCtrl(); loadBgImage(); draw();
    });
    b.addEventListener('dblclick', () => {
      const nc = prompt('층 이름을 입력하세요 (예: 1, 2, B1)', f.code);
      if (!nc) return;
      if (!/^B?\d+$/i.test(nc.trim())) { alert('형식: 숫자 또는 B+숫자 (예: 1, 2, B1)'); return; }
      pushUndo();
      f.code = nc.trim().toUpperCase().replace(/^b/, 'B');
      renderFloors(); autosave();
    });
    el.appendChild(b);
  });
}
document.getElementById('btnAddFloor').addEventListener('click', () => {
  const nc = prompt('추가할 층 이름 (예: 2, 3, B1)', '');
  if (!nc) return;
  const code = nc.trim().toUpperCase();
  if (!/^B?\d+$/.test(code)) { alert('형식: 숫자 또는 B+숫자 (예: 1, 2, B1)'); return; }
  if (state.floors.some(f => f.code === code)) { alert('이미 있는 층입니다.'); return; }
  pushUndo();
  state.floors.push(newFloor(code));
  state.cur = state.floors.length - 1;
  selSet = [];
  renderFloors(); renderProps(); renderBgCtrl(); draw(); autosave();
});

// ===== 내보내기 =====
function contentBBox() {
  const list = objs();
  if (!list.length) return null;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  list.forEach(o => {
    const b = objBounds(o);
    x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y);
    x1 = Math.max(x1, b.x + b.w); y1 = Math.max(y1, b.y + b.h);
  });
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}

document.getElementById('btnPng').addEventListener('click', () => {
  const bb = exportBBox(null);
  if (!bb) { alert('내보낼 내용이 없습니다. 먼저 맵을 그려주세요.'); return; }
  const f = floor();
  const { oc, c } = exportCanvas(bb, 0, expScale(), '#ffffff');
  if (f.bgExport && f.bg && bgImgCache[state.cur] && bgImgCache[state.cur].complete) {
    c.save();
    c.globalAlpha = f.bgOp;
    const img = bgImgCache[state.cur];
    c.drawImage(img, 0, 0, img.width * f.bgSc, img.height * f.bgSc);
    c.restore();
  }
  drawObjects(c, { selection: false });
  dl(oc.toDataURL('image/png'), 'daegu_map_' + f.code + '.png');
});
