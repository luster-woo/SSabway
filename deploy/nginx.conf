server {
    listen 80;
    client_max_body_size 20M;

    # ── 업스트림 DNS 재조회 ────────────────────────────────────────────
    # proxy_pass 에 호스트명을 리터럴로 쓰면 nginx 가 기동 시 1회만 DNS 를
    # 조회하고 그 IP 를 영구 캐싱한다. 컨테이너가 재생성되면(OOM 재시작 등)
    # IP 가 바뀌어 재배포까지 502 가 계속된다.
    # 변수로 넘기면 매 요청마다 이 resolver 로 다시 조회한다.
    # (Docker 내장 DNS = 127.0.0.11. 변수 사용 시 URI 가 자동으로 붙지
    #  않으므로 반드시 $request_uri 를 이어붙일 것)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── 공통 프록시 헤더 ──────────────────────────────────────────────
    # ⚠️ nginx 의 proxy_set_header 는 "덮어쓰기" 상속이다. 어떤 location 이
    #    proxy_set_header 를 하나라도 선언하면 이 server 블록의 헤더를
    #    전혀 물려받지 못한다. 그래서 헤더를 추가해야 하는 /signal/ 블록은
    #    아래에서 전체를 다시 적는다.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # ── 라우팅 규칙 ───────────────────────────────────────────────────
    # /api/v1 은 두 서비스가 나눠 갖는다.
    #   ssabway(api)     : 회원·인증·경로, 상담 "생성", 역무원 조회 3종
    #                      (/staffs/login, /staffs/waiting, /staffs/history,
    #                       GET /staffs/consultations?id=, /staffs/blacklist)
    #   ssabway_webrtc   : 상담 "생명주기" + OpenVidu
    #                      (GET /consultations/{id}, /consultations/{id}/cancel,
    #                       /openvidu/**, /staffs/consultations/{id}/accept)
    #
    # ⚠️ 경로가 두 군데서 겹쳐 갈라진다. 둘 다 trailing slash 유무로 가른다.
    #
    #   1) /api/v1/consultations
    #      - POST (정확일치, 하위 경로 없음) → api. 상담 생성은 ssabway 소유다.
    #        (webrtc 에도 같은 경로가 있지만 그쪽 엔티티에 departure/destination
    #         필드가 없어 NOT NULL 컬럼을 못 채우고 INSERT 가 실패한다.
    #         중복 구현이므로 BE 가 webrtc 쪽을 지우는 것이 정리 방향이다.)
    #      - GET /{id}, POST /{id}/cancel → signaling (webrtc 단독 소유)
    #
    #   2) /api/v1/staffs/consultations
    #      - GET ?id=1 (정확일치) → api. 상담 상세·녹취 조회.
    #      - POST /{id}/accept → signaling. 수락 + 세션 생성.
    #
    # 이 구분이 깨지면 대기 목록·상세(api)와 생성·수락(각 서비스)이 서로 404 가
    # 된다. 슬래시 없는 쪽을 `=` 블록으로 명시해 두면, 나중에 prefix 블록이
    # 추가돼도 이 두 경로의 목적지가 흔들리지 않는다.
    # (⚠️ `=` 는 슬래시가 붙은 변형까지 잡아 주지는 못한다. 클라이언트가
    #  `/staffs/consultations/?id=1` 처럼 보내면 signaling prefix 로 새어
    #  404 다 — 어차피 Spring 도 기본 설정에서 trailing slash 를 안 받으므로
    #  방어하지 않고 프론트가 정확한 경로로 보내는 것에 의존한다.)
    #
    # nginx 는 정확 일치(=)를 먼저 보고, 그다음 가장 긴 prefix 를 택한다.
    # 따라서 아래 블록들의 작성 순서 자체는 의미가 없다.

    # 상담 요청 생성 — POST /api/v1/consultations → api (ssabway)
    # 역무원은 서버가 departureStationId 로 자동 배정한다 (ConsultationService).
    location = /api/v1/consultations {
        set $api_create http://api:8080;
        proxy_pass $api_create$request_uri;
    }

    # 상담 상태 조회 / 대기 취소 — /api/v1/consultations/{id}[/cancel]
    location /api/v1/consultations/ {
        set $signaling_consultations http://signaling:8080;
        proxy_pass $signaling_consultations$request_uri;
    }

    # OpenVidu 커넥션·시작·종료 + OpenVidu 서버가 호출하는 녹취 웹훅.
    # 웹훅이 도달하지 못하면 녹취 S3 업로드가 영구히 실행되지 않는다.
    location /api/v1/openvidu/ {
        set $signaling_openvidu http://signaling:8080;
        proxy_pass $signaling_openvidu$request_uri;
    }

    # 상담 상세·녹취 조회 — GET /api/v1/staffs/consultations?id=1 → api
    # (아래 signaling prefix 와 한 글자 차이라 정확일치로 못 박아 둔다)
    location = /api/v1/staffs/consultations {
        set $api_detail http://api:8080;
        proxy_pass $api_detail$request_uri;
    }

    # 역무원 상담 수락 — /api/v1/staffs/consultations/{id}/accept
    location /api/v1/staffs/consultations/ {
        set $signaling_staff http://signaling:8080;
        proxy_pass $signaling_staff$request_uri;
    }

    # 그 밖의 모든 /api/ — ssabway
    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream$request_uri;
    }

    # ── WebSocket (STOMP 예정) ────────────────────────────────────────
    # ⚠️ 아직 쓰이지 않는다 — 백엔드에 /signal 핸들러가 없고 프론트도
    #    호출하지 않는다(OpenVidu 시그널링은 토큰에 담긴 OpenVidu 서버로
    #    브라우저가 직접 붙는다). 관리자 대기열 실시간화(STOMP)가 들어올
    #    자리라 설정만 미리 맞춰 둔다.
    #    유휴 WS 가 기본 60초에 끊기지 않도록 타임아웃을 늘려 둔다.
    location /signal/ {
        set $signaling_ws http://signaling:8080;
        proxy_pass $signaling_ws$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # GitLab 웹훅 → Jenkins (이 경로 하나만 개방, Jenkins UI는 여전히 터널 전용)
    location = /git/notifyCommit {
        set $jenkins_upstream http://jenkins:8080;
        proxy_pass $jenkins_upstream$request_uri;
    }

    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream$request_uri;
    }
}
