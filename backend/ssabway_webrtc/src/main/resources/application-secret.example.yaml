# 이 파일을 application-secret.yaml 로 복사한 뒤 값을 채우세요. (로컬 전용, gitignore)
# Docker 실행 시엔 이 파일 대신 루트 .env 가 사용됩니다.
# 키 이름은 .env / application.yaml 의 ${...} placeholder 와 동일하게 유지하세요.

OPENVIDU_URL: http://localhost:4443
OPENVIDU_SECRET: dummy
OPENVIDU_WEBHOOK_SECRET: ""

# 메인 백엔드에서 JWT 발급에 사용하는 값과 동일해야 합니다.
JWT_SECRET: "YOUR_BASE64_JWT_SECRET"

AWS_ACCESS_KEY_ID: ""
AWS_SECRET_ACCESS_KEY: ""
AWS_REGION: ap-northeast-2
AWS_S3_BUCKET: ""

# 로컬 MySQL 이 기본값(root/localonly)과 다를 때만 주석 해제해 덮어쓰기
# SPRING_DATASOURCE_USERNAME: root
# SPRING_DATASOURCE_PASSWORD: localonly

# 메인 백엔드와 WebRTC 서버 간 내부 API 인증값
INTERNAL_API_SECRET: "YOUR_INTERNAL_API_SECRET"
