spring:
  application:
    name: ssabway

  # 로컬 전용 시크릿(선택). 존재하면 .env 대신 이 파일이 placeholder 를 채움.
  # Docker 에는 이 파일이 없으므로 .env(환경변수)가 사용됨.
  config:
    import: optional:application-secret.yml

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ssabway_db}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:localonly}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 표지판 사진 업로드. 기본값이 파일 1MB 라 폰 사진은 그대로 튕긴다.
  # 앱이 1280px 로 줄여 보내면 0.3MB 안팎이지만, 원본을 올리는 경로가
  # 남아 있어 여유를 둔다. nginx 의 client_max_body_size 20M 보다는 작게.
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB

  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 719352113387-r5stvku567sapsg850mpjfet14cq5vvr.apps.googleusercontent.com

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000      # 30분
  refresh-token-expiration: 1209600000  # 14일

aws:
  region: ${AWS_REGION:ap-northeast-2}
  access-key: ${AWS_ACCESS_KEY_ID}
  secret-key: ${AWS_SECRET_ACCESS_KEY}
  s3:
    bucket: ${AWS_S3_BUCKET}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

odsay:
  api-key: ${ODSAY_API_KEY}
  base-url: https://api.odsay.com/v1/api
  connect-timeout: 3000
  read-timeout: 5000

# 역 내 길안내
#   graph-location  지도 편집 툴이 내보낸 노드·엣지
#   guide-location  구간별 안내 문구 (한/영/일/중)
#   두 파일은 항상 같이 갱신해야 한다. 엣지를 지우면 문구가 남아돌고,
#   엣지를 추가하면 문구가 없어 null 이 나간다.
navigation:
  graph-location: classpath:navigation/daegu_navigation.json
  guide-location: classpath:navigation/daegu_user_guide.json
  # 표지판 사진 주소의 앞부분. S3 버킷의 img 폴더까지를 가리킨다.
  # 데이터에는 파일명(S3_15_B.jpg)만 두고 주소는 여기에만 둔다.
  # 버킷이나 CDN 이 바뀌어도 노드·엣지 데이터를 고칠 필요가 없다.
  sign-image-base-url: ${SIGN_IMAGE_BASE_URL:https://${aws.s3.bucket}.s3.${aws.region}.amazonaws.com/img}


# 표지판 인식 AI 서버 (ai/serve — FastAPI)
#   base-url  도커 네트워크 안의 서비스명. 외부에 포트를 열지 않는다.
#             (docker-compose.prod.yml 의 ai 서비스, 8000)
#   read-timeout  CPU 추론이라 순간 부하에서 수 초가 걸린다. 프론트가 20초에
#             끊으므로(predictSign.ts) 그보다 짧게 두어 서버가 먼저 정리한다.
ai:
  base-url: ${AI_BASE_URL:http://ai:8000}
  connect-timeout: 2000
  read-timeout: 15000


webrtc :
  # ⚠️ 변수명은 docker-compose.yml 의 api.environment.WEBRTC_BASE_URL 과
  #    반드시 같아야 한다. 다르면 조용히 fallback 으로 떨어져 api 가 자기
  #    컨테이너의 localhost 를 호출하고 상담 수락이 전부 실패한다.
  #    fallback 은 로컬에서 직접 띄운 signaling 포트(override.yml 의 8082).
  base-url : ${WEBRTC_BASE_URL:http://localhost:8082}
  api-key : ${WEBRTC_INTERNAL_SECRET}
