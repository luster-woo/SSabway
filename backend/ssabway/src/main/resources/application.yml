spring:
  application:
    name: ssabway

  # 로컬 전용 시크릿(선택). 존재하면 .env 대신 이 파일이 placeholder 를 채움.
  # Docker 에는 이 파일이 없으므로 .env(환경변수)가 사용됨.
  config:
    import: optional:application-secret.yml

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ssabway_db}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:localonly}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 719352113387-r5stvku567sapsg850mpjfet14cq5vvr.apps.googleusercontent.com

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000      # 30분
  refresh-token-expiration: 1209600000  # 14일

aws:
  region: ${AWS_REGION:ap-northeast-2}
  access-key: ${AWS_ACCESS_KEY_ID}
  secret-key: ${AWS_SECRET_ACCESS_KEY}
  s3:
    bucket: ${AWS_S3_BUCKET}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

odsay:
  api-key: ${ODSAY_API_KEY}
  base-url: https://api.odsay.com/v1/api
  connect-timeout: 3000
  read-timeout: 5000

# 역 내 길안내
#   graph-location  지도 편집 툴이 내보낸 노드·엣지
#   guide-location  구간별 안내 문구 (한/영/일/중)
#   두 파일은 항상 같이 갱신해야 한다. 엣지를 지우면 문구가 남아돌고,
#   엣지를 추가하면 문구가 없어 null 이 나간다.
navigation:
  graph-location: classpath:navigation/daegu_navigation.json
  guide-location: classpath:navigation/daegu_user_guide.json
  sign-image-base-url: ${SIGN_IMAGE_BASE_URL:https://ssabway.s3.ap-northeast-2.amazonaws.com/signs}


webrtc :
  # ⚠️ 변수명은 docker-compose.yml 의 api.environment.WEBRTC_BASE_URL 과
  #    반드시 같아야 한다. 다르면 조용히 fallback 으로 떨어져 api 가 자기
  #    컨테이너의 localhost 를 호출하고 상담 수락이 전부 실패한다.
  #    fallback 은 로컬에서 직접 띄운 signaling 포트(override.yml 의 8082).
  base-url : ${WEBRTC_BASE_URL:http://localhost:8082}
  api-key : ${WEBRTC_INTERNAL_SECRET}