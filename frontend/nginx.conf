server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 지하철역 저품질 회선 + 모바일이 주 사용 환경이라 압축이 체감에 직결된다.
    # nginx:alpine 기본 설정은 gzip off 이므로 여기서 켠다.
    # (이미 압축된 png/jpg/woff2 는 대상에서 제외)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml
        text/css
        text/plain;

    # 해시가 붙은 빌드 산출물이라 영구 캐시해도 안전하다.
    # ⚠️ expires 와 add_header Cache-Control 을 같이 쓰면 헤더가 두 번 실린다
    #    (expires 가 자체적으로 Cache-Control 을 만든다). add_header 만 쓴다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── 아래 넷은 파일명에 해시가 없어 캐시되면 업데이트가 늦어진다 ──

    # 서비스 워커. 브라우저가 이 파일의 변경으로 새 배포를 감지하므로
    # 캐시되면 autoUpdate 자체가 지연된다.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 설치된 PWA의 이름/아이콘 변경이 제때 반영되도록
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
    }

    # 런타임 설정(window.__ENV__). Cache-Control 이 없으면 브라우저가
    # Last-Modified 기반 heuristic 으로 재검증 없이 캐시해, 키를 교체해도
    # 일부 사용자가 며칠간 옛 값을 계속 쓴다.
    # ⚠️ precache 대상에서도 빠져 있다 (vite.config.ts 의 globIgnores).
    location = /config.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
